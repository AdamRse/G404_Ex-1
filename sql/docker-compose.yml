services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-local
    restart: no
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: monmotdepasse
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
